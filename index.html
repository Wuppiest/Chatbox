<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0c0c0e">
<title>Chat</title>
<style>
  :root {
    --bg: #0c0c0e;
    --surface: #151518;
    --surface-2: #1c1c20;
    --border: #26262b;
    --text: #ececf0;
    --muted: #7b7b86;
    --own: #2f6df6;
    --own-text: #ffffff;
    --err: #e5586e;
    --ok: #46c08a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input { font: inherit; font-size: 16px; color: var(--text); }

  #app {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 100%;
    display: flex;
    flex-direction: column;
    max-width: 720px;
    margin: 0 auto;
    background: var(--bg);
    padding-top: env(safe-area-inset-top, 0px);
  }

  /* Header */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1rem; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--err); transition: background .3s; }
  .dot.online { background: var(--ok); }
  .actions { display: flex; gap: 6px; }
  .btn-ghost {
    padding: 7px 12px;
    border-radius: 10px;
    font-size: .85rem;
    color: var(--muted);
    border: 1px solid var(--border);
    transition: color .15s, border-color .15s, background .15s;
  }
  .btn-ghost:hover { color: var(--text); background: var(--surface); }
  .btn-ghost.danger:hover { color: var(--err); border-color: var(--err); }

  /* Messages */
  #messages {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  #messages::-webkit-scrollbar { width: 6px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  .empty { margin: auto; color: var(--muted); font-size: .9rem; }

  .row { display: flex; }
  .row.own { justify-content: flex-end; }
  .row.other { justify-content: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 8px 12px 6px;
    border-radius: 16px;
    background: var(--surface-2);
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .bubble.has-photo { padding: 4px 4px 6px; }
  .bubble.has-photo .name,
  .bubble.has-photo .text,
  .bubble.has-photo .foot { padding-left: 8px; padding-right: 8px; }
  .row.own .bubble { background: var(--own); color: var(--own-text); border-bottom-right-radius: 5px; }
  .row.other .bubble { border-bottom-left-radius: 5px; }
  .name { font-size: .78rem; font-weight: 600; margin-bottom: 2px; }
  .bubble.has-photo .name { padding-top: 4px; }
  .text { font-size: .95rem; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
  .photo {
    display: block;
    max-width: 100%;
    max-height: 340px;
    border-radius: 12px;
    margin-bottom: 4px;
    cursor: zoom-in;
    background: var(--surface);
  }
  .foot {
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    gap: 8px;
    margin-top: 2px;
    font-size: .7rem;
    color: var(--muted);
  }
  .row.own .foot { color: rgba(255,255,255,.7); }
  .time { font-variant-numeric: tabular-nums; font-weight: 600; }
  .row.other .time { color: #8aa4ff; }
  .edited { font-style: italic; }
  .edit-btn {
    font-size: .7rem;
    color: inherit;
    text-decoration: underline;
    text-underline-offset: 2px;
    opacity: .85;
    padding: 0;
  }

  /* Info bars (edit / photo) */
  .bar {
    display: none;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    background: var(--surface);
    font-size: .82rem;
  }
  .bar.active { display: flex; }
  .bar .label { color: var(--own); font-weight: 600; }
  .bar .preview {
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    margin-left: 10px;
  }
  #photoThumb {
    width: 44px; height: 44px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--border);
  }
  #photoBar .left { display: flex; align-items: center; gap: 12px; }

  /* Composer */
  .composer {
    position: relative;
    display: flex;
    gap: 8px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
  }
  #attach {
    width: 44px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    transition: color .15s, border-color .15s;
  }
  #attach:hover, #attach.open { color: var(--text); border-color: var(--own); }
  .attach-menu {
    position: absolute;
    left: 12px;
    bottom: calc(100% + 8px);
    display: none;
    flex-direction: column;
    min-width: 140px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
    z-index: 12;
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
  }
  .attach-menu.active { display: flex; }
  .attach-menu button { padding: 13px 18px; text-align: left; font-size: .92rem; }
  .attach-menu button + button { border-top: 1px solid var(--border); }
  .attach-menu button:hover { background: var(--surface); }
  #message {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 11px 14px;
    outline: none;
    transition: border-color .15s;
  }
  #message::placeholder { color: var(--muted); }
  #message:focus { border-color: var(--own); }
  #send {
    background: var(--own);
    color: #fff;
    font-weight: 600;
    padding: 0 20px;
    border-radius: 12px;
    transition: opacity .15s, transform .1s;
  }
  #send:active { transform: scale(.97); }
  #send:disabled { opacity: .4; cursor: not-allowed; }

  /* GIF panel */
  #gifPanel {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 62%;
    z-index: 15;
    display: none;
    flex-direction: column;
    background: var(--bg);
    border-top: 1px solid var(--border);
    border-radius: 18px 18px 0 0;
    box-shadow: 0 -10px 30px rgba(0,0,0,.5);
  }
  #gifPanel.active { display: flex; }
  .gif-head { display: flex; gap: 8px; padding: 12px; }
  #gifSearch {
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    outline: none;
  }
  #gifSearch::placeholder { color: var(--muted); }
  #gifSearch:focus { border-color: var(--own); }
  #gifGrid {
    flex: 1;
    overflow-y: auto;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    padding: 0 12px 12px;
    column-count: 2;
    column-gap: 6px;
  }
  .gif-item {
    display: block;
    width: 100%;
    margin-bottom: 6px;
    break-inside: avoid;
    border-radius: 10px;
    overflow: hidden;
    background: var(--surface);
  }
  .gif-item img { display: block; width: 100%; height: auto; }
  .gif-info { column-span: all; text-align: center; color: var(--muted); font-size: .88rem; padding: 24px 12px; }
  .gif-foot {
    text-align: center;
    font-size: .7rem;
    color: var(--muted);
    padding: 6px 0 calc(8px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
  }

  /* Login */
  #login {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    padding: 24px;
  }
  #login.hidden { display: none; }
  #login h1 { font-size: 1.4rem; font-weight: 600; }
  .users { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px; }
  .user-btn {
    padding: 15px;
    border-radius: 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    font-size: 1rem;
    font-weight: 600;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .user-btn:hover { border-color: var(--own); background: var(--surface-2); }
  .user-btn:active { transform: scale(.98); }

  /* Lightbox */
  #lightbox {
    position: fixed;
    inset: 0;
    z-index: 20;
    background: rgba(0,0,0,.94);
    display: none;
    align-items: center;
    justify-content: center;
    padding: 16px;
    cursor: zoom-out;
  }
  #lightbox.active { display: flex; }
  #lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
</style>
</head>
<body>

  <div id="login">
    <h1>Wer bist du?</h1>
    <div class="users">
      <button class="user-btn" data-user="Maxi">Maxi</button>
      <button class="user-btn" data-user="Jonas">Jonas</button>
      <button class="user-btn" data-user="Ben">Ben</button>
    </div>
  </div>

  <div id="lightbox"><img id="lightImg" alt=""></div>

  <div id="app">
    <header>
      <div class="title"><span class="dot" id="dot"></span><span id="statusText">Verbinde</span></div>
      <div class="actions">
        <button class="btn-ghost" id="switchBtn">Wechseln</button>
        <button class="btn-ghost danger" id="clearBtn">Leeren</button>
      </div>
    </header>

    <div id="messages"><div class="empty">Noch keine Nachrichten.</div></div>

    <div id="editBar" class="bar">
      <span class="label">Bearbeiten</span>
      <span class="preview" id="editPreview"></span>
      <button class="btn-ghost" id="editCancel">Abbrechen</button>
    </div>

    <div id="photoBar" class="bar">
      <div class="left">
        <img id="photoThumb" alt="">
        <span class="label">Foto</span>
      </div>
      <button class="btn-ghost" id="photoCancel">Entfernen</button>
    </div>

    <div class="composer">
      <div class="attach-menu" id="attachMenu">
        <button type="button" id="menuPhoto">Foto</button>
        <button type="button" id="menuGif">GIF</button>
      </div>
      <button id="attach" type="button" aria-label="Anhang">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 16V4"/>
          <path d="M7 9l5-5 5 5"/>
          <path d="M5 20h14"/>
        </svg>
      </button>
      <input id="fileInput" type="file" accept="image/*" hidden>
      <input id="message" type="text" placeholder="Nachricht" maxlength="1000" autocomplete="off" autocorrect="on" enterkeyhint="send">
      <button id="send" disabled>Senden</button>
    </div>

    <div id="gifPanel">
      <div class="gif-head">
        <input id="gifSearch" type="search" placeholder="GIFs suchen" autocomplete="off" enterkeyhint="search">
        <button class="btn-ghost" id="gifClose">Schließen</button>
      </div>
      <div id="gifGrid"></div>
      <div class="gif-foot">Powered by GIPHY</div>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const SERVER_URL = 'https://chatbox-rfdm.onrender.com';
    const GIPHY_API_KEY = 'Mvntu3pdtUlrgqQ8w2MMtAYWJ2kwBK1U';

    const COLORS = { Maxi: '#f0a35e', Jonas: '#58c4a0', Ben: '#8aa4ff' };
    const MAX_IMAGE_CHARS = 950000;
    const IMAGE_RE = /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+\/=]+$/;
    const GIF_RE = /^https:\/\/(media\d*|i)\.giphy\.com\/[A-Za-z0-9_\-.\/]+(\?[A-Za-z0-9_=&%.\-]*)?$/;

    const $app = document.getElementById('app');
    const $login = document.getElementById('login');
    const $messages = document.getElementById('messages');
    const $message = document.getElementById('message');
    const $send = document.getElementById('send');
    const $dot = document.getElementById('dot');
    const $status = document.getElementById('statusText');
    const $editBar = document.getElementById('editBar');
    const $editPreview = document.getElementById('editPreview');
    const $photoBar = document.getElementById('photoBar');
    const $photoThumb = document.getElementById('photoThumb');
    const $fileInput = document.getElementById('fileInput');
    const $lightbox = document.getElementById('lightbox');
    const $lightImg = document.getElementById('lightImg');
    const $attach = document.getElementById('attach');
    const $attachMenu = document.getElementById('attachMenu');
    const $gifPanel = document.getElementById('gifPanel');
    const $gifSearch = document.getElementById('gifSearch');
    const $gifGrid = document.getElementById('gifGrid');

    let me = null;
    let messages = [];
    let editing = null;
    let pendingImage = null;
    let pinned = true;

    /* ---------- XSS-Schutz ---------- */
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/`/g, '&#96;');
    }

    function safeImage(src) {
      return typeof src === 'string' && src.length <= MAX_IMAGE_CHARS + 100 && IMAGE_RE.test(src) ? src : null;
    }

    function safeGif(src) {
      return typeof src === 'string' && src.length <= 600 && GIF_RE.test(src) ? src : null;
    }

    /* ---------- Storage ---------- */
    function store(action, key, val) {
      try {
        if (action === 'get') return localStorage.getItem(key);
        if (action === 'set') return localStorage.setItem(key, val);
        if (action === 'del') return localStorage.removeItem(key);
      } catch (e) { return null; }
    }

    /* ---------- Zeit (24 h) ---------- */
    function pad(n) { return String(n).padStart(2, '0'); }

    function formatTime(t) {
      if (t === undefined || t === null || t === '') return '';
      if (typeof t === 'string') {
        const s = t.trim();
        if (!/^\d{4}-\d{2}-\d{2}T/.test(s)) {
          const ampm = s.match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPp])\.?\s*[Mm]/);
          if (ampm) {
            let h = parseInt(ampm[1], 10) % 12;
            if (/p/i.test(ampm[3])) h += 12;
            return pad(h) + ':' + ampm[2];
          }
          const plain = s.match(/(\d{1,2}):(\d{2})/);
          if (plain) return pad(parseInt(plain[1], 10)) + ':' + plain[2];
        }
      }
      const d = new Date(t);
      if (!isNaN(d)) return pad(d.getHours()) + ':' + pad(d.getMinutes());
      return String(t);
    }

    /* ---------- Rendering ---------- */
    function nearBottom() {
      return $messages.scrollHeight - $messages.scrollTop - $messages.clientHeight < 120;
    }
    function scrollBottom() { $messages.scrollTop = $messages.scrollHeight; }

    $messages.addEventListener('scroll', () => { pinned = nearBottom(); });

    function buildRow(m) {
      const own = m.user === me;
      const row = document.createElement('div');
      row.className = 'row ' + (own ? 'own' : 'other');
      if (m.id !== undefined && m.id !== null) row.dataset.id = String(m.id);

      const color = COLORS[m.user] || '#aaaaaa';
      const canEdit = own && m.id !== undefined && m.id !== null;
      const media = safeImage(m.image) || safeGif(m.gif);

      row.innerHTML =
        '<div class="bubble' + (media ? ' has-photo' : '') + '">' +
          (own ? '' : '<div class="name" style="color:' + color + '">' + escapeHtml(m.user) + '</div>') +
          (media ? '<img class="photo" alt="" src="' + escapeHtml(media) + '">' : '') +
          (m.text ? '<div class="text">' + escapeHtml(m.text) + '</div>' : '') +
          '<div class="foot">' +
            (canEdit ? '<button class="edit-btn" data-action="edit">Bearbeiten</button>' : '') +
            (m.edited ? '<span class="edited">bearbeitet</span>' : '') +
            '<span class="time">' + escapeHtml(formatTime(m.time)) + '</span>' +
          '</div>' +
        '</div>';

      const photo = row.querySelector('.photo');
      if (photo) photo.addEventListener('load', () => { if (pinned) scrollBottom(); });
      return row;
    }

    function renderAll() {
      $messages.innerHTML = '';
      if (!messages.length) {
        $messages.innerHTML = '<div class="empty">Noch keine Nachrichten.</div>';
        return;
      }
      const frag = document.createDocumentFragment();
      messages.forEach(m => frag.appendChild(buildRow(m)));
      $messages.appendChild(frag);
      scrollBottom();
    }

    function appendOne(m) {
      const empty = $messages.querySelector('.empty');
      if (empty) empty.remove();
      const stick = nearBottom() || m.user === me;
      $messages.appendChild(buildRow(m));
      if (stick) { pinned = true; scrollBottom(); }
    }

    /* ---------- Benutzer ---------- */
    function setUser(name) {
      me = name;
      store('set', 'chat_user', name);
      $login.classList.add('hidden');
      cancelEdit();
      clearPhoto();
      closeGifPanel();
      renderAll();
    }

    document.querySelectorAll('.user-btn').forEach(btn => {
      btn.addEventListener('click', () => setUser(btn.dataset.user));
    });

    document.getElementById('switchBtn').addEventListener('click', () => {
      me = null;
      store('del', 'chat_user');
      cancelEdit();
      clearPhoto();
      closeGifPanel();
      $login.classList.remove('hidden');
    });

    const saved = store('get', 'chat_user');
    if (saved && COLORS[saved]) {
      me = saved;
      $login.classList.add('hidden');
    }

    /* ---------- Socket ---------- */
    const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

    function setStatus(online, text) {
      $dot.classList.toggle('online', online);
      $status.textContent = text;
      $send.disabled = !online;
    }

    socket.on('connect', () => setStatus(true, 'Online'));
    socket.on('disconnect', () => setStatus(false, 'Getrennt'));
    socket.on('connect_error', () => setStatus(false, 'Server startet'));

    socket.on('loadHistory', (history) => {
      messages = Array.isArray(history) ? history.slice() : [];
      pinned = true;
      renderAll();
    });

    socket.on('chatMessage', (msg) => {
      if (!msg) return;
      if (msg.id !== undefined && messages.some(x => x.id === msg.id)) return;
      messages.push(msg);
      appendOne(msg);
    });

    socket.on('messageEdited', (data) => {
      if (!data) return;
      const m = messages.find(x => x.id === data.id);
      if (!m) return;
      m.text = data.text;
      m.edited = true;
      if (editing && editing.id === m.id) cancelEdit();
      const top = $messages.scrollTop;
      const wasPinned = pinned;
      renderAll();
      if (!wasPinned) $messages.scrollTop = top;
    });

    socket.on('chatCleared', () => {
      messages = [];
      cancelEdit();
      renderAll();
    });

    /* ---------- Anhang-Menue ---------- */
    function closeMenu() {
      $attachMenu.classList.remove('active');
      $attach.classList.remove('open');
    }

    $attach.addEventListener('click', (e) => {
      e.stopPropagation();
      if (!me) return;
      const open = $attachMenu.classList.toggle('active');
      $attach.classList.toggle('open', open);
    });
    document.addEventListener('click', closeMenu);

    document.getElementById('menuPhoto').addEventListener('click', () => {
      closeMenu();
      if (!me) return;
      if (editing) cancelEdit();
      $fileInput.click();
    });

    document.getElementById('menuGif').addEventListener('click', () => {
      closeMenu();
      if (!me) return;
      if (editing) cancelEdit();
      openGifPanel();
    });

    /* ---------- Fotos ---------- */
    function loadAndScale(file, maxSide, quality) {
      return new Promise((resolve, reject) => {
        const url = URL.createObjectURL(file);
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement('canvas');
          canvas.width = w;
          canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Bild nicht lesbar')); };
        img.src = url;
      });
    }

    async function compressImage(file) {
      const attempts = [[1280, 0.78], [1024, 0.65], [800, 0.55]];
      for (const [side, q] of attempts) {
        const data = await loadAndScale(file, side, q);
        if (data.length <= MAX_IMAGE_CHARS) return data;
      }
      throw new Error('Bild zu gross');
    }

    function setPhoto(dataUrl) {
      pendingImage = dataUrl;
      $photoThumb.src = dataUrl;
      $photoBar.classList.add('active');
    }

    function clearPhoto() {
      pendingImage = null;
      $photoThumb.removeAttribute('src');
      $photoBar.classList.remove('active');
      $fileInput.value = '';
    }

    $fileInput.addEventListener('change', async () => {
      const file = $fileInput.files && $fileInput.files[0];
      if (!file) return;
      try {
        setPhoto(await compressImage(file));
        $message.focus();
      } catch (e) {
        clearPhoto();
        alert('Das Foto konnte nicht geladen werden.');
      }
    });

    document.getElementById('photoCancel').addEventListener('click', clearPhoto);

    /* ---------- GIFs (GIPHY) ---------- */
    let gifTimer = null;
    let gifReq = 0;

    function openGifPanel() {
      $gifPanel.classList.add('active');
      $gifSearch.value = '';
      loadGifs('');
    }

    function closeGifPanel() {
      $gifPanel.classList.remove('active');
      $gifSearch.blur();
    }

    function gifInfo(text) {
      $gifGrid.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'gif-info';
      d.textContent = text;
      $gifGrid.appendChild(d);
    }

    async function loadGifs(query) {
      if (!GIPHY_API_KEY || GIPHY_API_KEY === 'DEIN_GIPHY_API_KEY') {
        gifInfo('GIPHY API-Key fehlt. Trage ihn oben im Script bei GIPHY_API_KEY ein.');
        return;
      }
      const id = ++gifReq;
      gifInfo('Lade');
      const params = new URLSearchParams({ api_key: GIPHY_API_KEY, limit: '30', rating: 'pg-13' });
      if (query) { params.set('q', query); params.set('lang', 'de'); }
      const url = 'https://api.giphy.com/v1/gifs/' + (query ? 'search' : 'trending') + '?' + params.toString();
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        if (id !== gifReq) return;
        renderGifs(Array.isArray(json.data) ? json.data : []);
      } catch (e) {
        if (id === gifReq) gifInfo('GIFs konnten nicht geladen werden.');
      }
    }

    function renderGifs(items) {
      $gifGrid.innerHTML = '';
      const frag = document.createDocumentFragment();
      items.forEach(item => {
        const imgs = item.images || {};
        const previewUrl = safeGif((imgs.fixed_width_small || imgs.fixed_width || {}).url);
        const sendUrl = safeGif((imgs.downsized || imgs.fixed_width || {}).url);
        if (!previewUrl || !sendUrl) return;

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'gif-item';
        btn.dataset.gif = sendUrl;

        const img = document.createElement('img');
        img.src = previewUrl;
        img.alt = '';
        img.loading = 'lazy';
        const base = imgs.fixed_width_small || imgs.fixed_width || {};
        const w = parseInt(base.width, 10);
        const h = parseInt(base.height, 10);
        if (w && h) img.style.aspectRatio = w + ' / ' + h;

        btn.appendChild(img);
        frag.appendChild(btn);
      });
      if (!frag.childNodes.length) { gifInfo('Keine GIFs gefunden.'); return; }
      $gifGrid.appendChild(frag);
      $gifGrid.scrollTop = 0;
    }

    $gifSearch.addEventListener('input', () => {
      clearTimeout(gifTimer);
      gifTimer = setTimeout(() => loadGifs($gifSearch.value.trim()), 350);
    });

    $gifSearch.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        clearTimeout(gifTimer);
        loadGifs($gifSearch.value.trim());
        $gifSearch.blur();
      }
    });

    $gifGrid.addEventListener('click', (e) => {
      const btn = e.target.closest('.gif-item');
      if (!btn || !me || !socket.connected) return;
      const gif = safeGif(btn.dataset.gif);
      if (!gif) return;
      socket.emit('chatMessage', { user: me, text: '', gif });
      closeGifPanel();
    });

    document.getElementById('gifClose').addEventListener('click', closeGifPanel);

    /* ---------- Lightbox + Bearbeiten-Klick ---------- */
    $messages.addEventListener('click', (e) => {
      const photo = e.target.closest('img.photo');
      if (photo) {
        $lightImg.src = photo.src;
        $lightbox.classList.add('active');
        return;
      }
      const btn = e.target.closest('[data-action="edit"]');
      if (btn) {
        const row = btn.closest('.row');
        if (row) startEdit(row.dataset.id);
      }
    });
    $lightbox.addEventListener('click', () => {
      $lightbox.classList.remove('active');
      $lightImg.removeAttribute('src');
    });

    /* ---------- Senden / Bearbeiten ---------- */
    function startEdit(id) {
      const m = messages.find(x => String(x.id) === String(id));
      if (!m || m.user !== me) return;
      clearPhoto();
      editing = m;
      $message.value = m.text || '';
      $editPreview.textContent = m.text || (m.gif ? 'GIF' : 'Foto');
      $editBar.classList.add('active');
      $message.focus();
    }

    function cancelEdit() {
      editing = null;
      $editBar.classList.remove('active');
      $editPreview.textContent = '';
      $message.value = '';
    }

    function sendMessage() {
      if (!me || !socket.connected) return;
      const text = $message.value.trim();

      if (editing) {
        const hasMedia = !!(editing.image || editing.gif);
        if ((text || hasMedia) && text !== (editing.text || '')) {
          socket.emit('editMessage', { id: editing.id, user: me, text });
        }
        cancelEdit();
        return;
      }

      if (!text && !pendingImage) return;

      const payload = { user: me, text };
      if (pendingImage) payload.image = pendingImage;
      socket.emit('chatMessage', payload);

      $message.value = '';
      clearPhoto();
      $message.focus();
    }

    $send.addEventListener('click', sendMessage);
    $message.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      } else if (e.key === 'Escape' && editing) {
        cancelEdit();
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeGifPanel();
        closeMenu();
      }
    });

    document.getElementById('editCancel').addEventListener('click', cancelEdit);

    /* ---------- Chat leeren ---------- */
    document.getElementById('clearBtn').addEventListener('click', () => {
      if (!confirm('Chat für alle leeren?')) return;
      socket.emit('clearChat');
      messages = [];
      cancelEdit();
      renderAll();
    });

    /* ---------- iOS: kein Zoom, kein Umherziehen ---------- */
    ['gesturestart', 'gesturechange', 'gestureend'].forEach(ev =>
      document.addEventListener(ev, e => e.preventDefault())
    );
    document.addEventListener('touchmove', (e) => {
      if (e.touches.length > 1 || !e.target.closest('#messages, #gifGrid')) e.preventDefault();
    }, { passive: false });
    let lastTouch = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouch < 300) e.preventDefault();
      lastTouch = now;
    }, { passive: false });

    if (window.visualViewport) {
      const vv = window.visualViewport;
      const fit = () => {
        $app.style.height = vv.height + 'px';
        $app.style.transform = 'translateY(' + vv.offsetTop + 'px)';
        window.scrollTo(0, 0);
        if (pinned) scrollBottom();
      };
      vv.addEventListener('resize', fit);
      vv.addEventListener('scroll', fit);
      fit();
    }
  </script>
</body>
</html>
