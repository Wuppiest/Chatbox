<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chatbox</title>
<style>
  :root {
    --bg: #0d0f14;
    --panel: #151922;
    --panel-2: #1c2230;
    --border: #262d3d;
    --text: #e6e9f0;
    --muted: #8892a6;
    --accent: #6c8cff;
    --accent-2: #8f6cff;
    --ok: #3ddc97;
    --err: #ff5c7a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 20% -10%, #1a2140 0%, var(--bg) 60%);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 760px;
    height: min(100%, 860px);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.5);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--panel-2), var(--panel));
  }
  header h1 {
    font-size: 1.1rem;
    font-weight: 700;
    letter-spacing: .2px;
  }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: .8rem;
    color: var(--muted);
  }
  .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--err);
    box-shadow: 0 0 8px currentColor;
    color: var(--err);
    transition: background .3s, color .3s;
  }
  .dot.online { background: var(--ok); color: var(--ok); }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 18px 20px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 8px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
  .empty {
    margin: auto;
    color: var(--muted);
    font-size: .9rem;
    text-align: center;
  }
  .msg {
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 10px 14px;
    max-width: 92%;
    align-self: flex-start;
    line-height: 1.45;
    word-wrap: break-word;
    overflow-wrap: anywhere;
    animation: pop .18s ease-out;
  }
  .msg.own {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(108,140,255,.18), rgba(143,108,255,.18));
    border-color: rgba(108,140,255,.4);
  }
  .meta {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin-bottom: 2px;
    font-size: .78rem;
  }
  .time { color: var(--accent); font-variant-numeric: tabular-nums; font-weight: 600; }
  .user { font-weight: 700; }
  .text { font-size: .95rem; white-space: pre-wrap; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .composer {
    display: grid;
    grid-template-columns: 150px 1fr auto;
    gap: 10px;
    padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
    border-top: 1px solid var(--border);
    background: var(--panel);
  }
  input {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    font: inherit;
    font-size: .95rem;
    outline: none;
    min-width: 0;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: var(--muted); }
  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(108,140,255,.18);
  }
  button {
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    border: 0;
    border-radius: 12px;
    padding: 0 22px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: transform .1s, filter .15s, opacity .15s;
  }
  button:hover { filter: brightness(1.1); }
  button:active { transform: scale(.97); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  @media (max-width: 560px) {
    body { padding: 0; }
    .app { border-radius: 0; height: 100%; border: 0; }
    .composer { grid-template-columns: 1fr auto; }
    #username { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
  <div class="app">
    <header>
      <h1>💬 Chatbox</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="statusText">Verbinde…</span></div>
    </header>

    <div id="messages"><div class="empty" id="empty">Noch keine Nachrichten.</div></div>

    <div class="composer">
      <input id="username" type="text" placeholder="Benutzername" maxlength="24" autocomplete="nickname">
      <input id="message" type="text" placeholder="Nachricht schreiben…" maxlength="1000" autocomplete="off">
      <button id="send" disabled>Senden</button>
    </div>
  </div>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <script>
    const SERVER_URL = 'https://chatbox-rfdm.onrender.com';

    const $messages = document.getElementById('messages');
    const $username = document.getElementById('username');
    const $message  = document.getElementById('message');
    const $send     = document.getElementById('send');
    const $dot      = document.getElementById('dot');
    const $status   = document.getElementById('statusText');

    /* ---------- XSS-Schutz ---------- */
    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/`/g, '&#96;');
    }

    /* ---------- Hilfsfunktionen ---------- */
    function safeStorage(action, key, val) {
      try {
        return action === 'get' ? localStorage.getItem(key) : localStorage.setItem(key, val);
      } catch (e) { return null; }
    }

    function userColor(name) {
      let h = 0;
      for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) % 360;
      return `hsl(${h}, 75%, 70%)`;
    }

    function formatTime(t) {
      if (t === undefined || t === null || t === '') return '';
      const d = new Date(t);
      if (typeof t === 'number' || (!isNaN(d) && /^\d{4}-\d{2}-\d{2}/.test(String(t)))) {
        return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
      }
      return String(t);
    }

    function isNearBottom() {
      return $messages.scrollHeight - $messages.scrollTop - $messages.clientHeight < 120;
    }

    function scrollToBottom() {
      $messages.scrollTop = $messages.scrollHeight;
    }

    /* ---------- Rendering ---------- */
    function addMessage(msg, { forceScroll = false } = {}) {
      if (!msg) return;
      const empty = document.getElementById('empty');
      if (empty) empty.remove();

      const stick = forceScroll || isNearBottom();
      const user = String(msg.user ?? 'Anonym');
      const own = user === $username.value.trim();

      const el = document.createElement('div');
      el.className = 'msg' + (own ? ' own' : '');
      el.innerHTML =
        '<div class="meta">' +
          '<span class="time">' + escapeHtml(formatTime(msg.time)) + '</span>' +
          '<span class="user" style="color:' + userColor(user) + '">' + escapeHtml(user) + '</span>' +
        '</div>' +
        '<div class="text">' + escapeHtml(msg.text) + '</div>';
      $messages.appendChild(el);

      if (stick) scrollToBottom();
    }

    function setStatus(online, text) {
      $dot.classList.toggle('online', online);
      $status.textContent = text;
      $send.disabled = !online;
    }

    /* ---------- Benutzername ---------- */
    $username.value = safeStorage('get', 'chat_username') || '';
    $username.addEventListener('input', () => {
      safeStorage('set', 'chat_username', $username.value.trim());
    });

    /* ---------- Socket ---------- */
    const socket = io(SERVER_URL, { transports: ['websocket', 'polling'] });

    socket.on('connect', () => setStatus(true, 'Online'));
    socket.on('disconnect', () => setStatus(false, 'Getrennt'));
    socket.on('connect_error', () => setStatus(false, 'Server startet… (Render kann ~30s brauchen)'));

    socket.on('loadHistory', (history) => {
      $messages.innerHTML = '';
      if (Array.isArray(history) && history.length) {
        history.forEach(m => addMessage(m, { forceScroll: true }));
      } else {
        $messages.innerHTML = '<div class="empty" id="empty">Noch keine Nachrichten.</div>';
      }
      scrollToBottom();
    });

    socket.on('chatMessage', (msg) => addMessage(msg));

    /* ---------- Senden ---------- */
    function sendMessage() {
      const user = $username.value.trim();
      const text = $message.value.trim();

      if (!user) { $username.focus(); return; }
      if (!text || !socket.connected) return;

      safeStorage('set', 'chat_username', user);
      socket.emit('chatMessage', { user, text });
      $message.value = '';
      $message.focus();
    }

    $send.addEventListener('click', sendMessage);
    $message.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) {
        e.preventDefault();
        sendMessage();
      }
    });
  </script>
</body>
</html>
